[project]
name = "rasterizer"
version = "0.1.0"
authors = [
    { name = "Nick Nassuphis", email = "nicknassuphis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numba>=0.62,<0.64",
    "numpy>=2.3,<2.4",
    "pillow>=12.1.0",
    "pyvips>=3.1.1",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
